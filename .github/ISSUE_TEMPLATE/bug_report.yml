name: Bug report
description: Report a non-sensitive RelayKit bug.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, active session codes, private relay URLs, private keys, user-identifying logs, or exploit details. Use SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: RelayKit version
      description: Version, commit, or release tag.
      placeholder: v0.1.1 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - rk
        - relaykitd
        - relaykit-agent
        - documentation
        - release artifacts
        - other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use placeholder tokens and documentation IPs.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Redact secrets, private hosts, user identities, and active session codes.
      render: text
