name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.archive }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: linux-x86_64
            arch: x86_64
            checksum: sha256sum
          - os: macos-14
            archive: macos-arm64
            arch: arm64
            checksum: shasum -a 256
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate runner architecture
        shell: bash
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          expected="${{ matrix.arch }}"
          if [ "$actual" != "$expected" ]; then
            echo "expected ${expected} runner for ${{ matrix.archive }}, got ${actual}" >&2
            exit 1
          fi

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="relaykit-${version}-${{ matrix.archive }}"
          mkdir -p "dist/${package}"
          cp target/release/relaykitd "dist/${package}/"
          cp target/release/relaykit-agent "dist/${package}/"
          cp target/release/rk "dist/${package}/"
          (
            cd "dist/${package}"
            ${{ matrix.checksum }} relaykitd relaykit-agent rk > SHA256SUMS
          )
          tar -czf "${package}.tar.gz" -C "dist/${package}" relaykitd relaykit-agent rk SHA256SUMS
          ${{ matrix.checksum }} "${package}.tar.gz" > "${package}.tar.gz.sha256"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: relaykit-${{ matrix.archive }}
          path: |
            relaykit-*.tar.gz
            relaykit-*.tar.gz.sha256

  publish:
    name: Draft GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --draft \
            --prerelease \
            --title "RelayKit ${version}" \
            --notes "Draft release generated by CI. Fill in release notes, verification evidence, and pilot scope before publishing."
