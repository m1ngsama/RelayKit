[package]
name = "relaykit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "rk"
path = "src/bin/rk.rs"

[[bin]]
name = "relaykit-agent"
path = "src/bin/relaykit-agent.rs"

[[bin]]
name = "relaykitd"
path = "src/bin/relaykitd.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
relaykit-agent = { path = "../relaykit-agent" }
relaykit-protocol = { path = "../relaykit-protocol" }
relaykit-server = { path = "../relaykit-server" }
relaykit-tunnel = { path = "../relaykit-tunnel" }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
